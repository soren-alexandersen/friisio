<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friis.io advisory</title>
  <meta name="description" content="Friis.io advisory. ERP and Microsoft Dynamics 365 Business Central advisory by Søren Friis Alexandersen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --slate: #304a4a;
      --accent: #c4785a;
      --muted: #6b7777;
      --rule: #d9dddd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Nunito", "Helvetica Neue", Arial, sans-serif;
      color: var(--slate);
      background: #fff;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    .logo {
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 0;
    }
    .logo .dot { color: var(--accent); }
    .tagline {
      margin: 0.9rem 0 0;
      font-size: clamp(0.9rem, 2.6vw, 1.25rem);
      font-weight: 600;
      letter-spacing: 0.55em;
      padding-left: 0.55em; /* balances the trailing letter spacing */
      text-transform: lowercase;
    }
    .intro {
      max-width: 34rem;
      margin: 2.5rem 0 0;
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--muted);
    }
    .person {
      margin: 2.5rem 0 0;
      padding-top: 2rem;
      border-top: 1px solid var(--rule);
      min-width: 16rem;
    }
    .person .name { font-size: 1.2rem; font-weight: 700; margin: 0; }
    .person .role { margin: 0.25rem 0 0; color: var(--muted); }
    .links { margin: 1rem 0 0; }
    .links a {
      color: var(--slate);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .links a:hover { color: var(--accent); }
    .links .sep { color: var(--accent); margin: 0 0.6rem; }
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1 class="logo">Friis<span class="dot">.</span>io</h1>
    <p class="tagline">advisory</p>

    <p class="intro">
      Independent advisory on ERP, Microsoft Dynamics 365 Business Central
      and the Microsoft partner ecosystem.
    </p>

    <div class="person">
      <p class="name">Søren Friis Alexandersen</p>
      <p class="role">Founder &amp; Advisor</p>
      <p class="links">
        <a href="mailto:soren@friis.io">soren@friis.io</a><span class="sep">•</span><a href="https://www.linkedin.com/in/YOUR-PROFILE/">LinkedIn</a>
      </p>
    </div>
  </main>

  <footer>
    Friis.io · CVR DK31439108 · Langåsen 18, DK-4450 Jyderup, Denmark
  </footer>
</body>
</html>
